<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Records — DDR Score Tracker</title>
<meta name="description" content="Every DanceDanceRevolution chart cleared with a Perfect Full Combo, filterable by difficulty, level, score and origin mix." />
<script>
  /* Theme and background palette are applied before first paint, so neither
     flashes the default on load. */
  try {
    var t = localStorage.getItem('ddr.theme');
    if (t) document.documentElement.dataset.theme = t;
    var p = localStorage.getItem('ddr.palette');
    if (p) document.documentElement.dataset.mix = p;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css?v=20260818230226" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306070c'/%3E%3Cpath d='M16 6l7 8h-4v6h-6v-6H9z' fill='%2349dcf5'/%3E%3C/svg%3E" />
</head>
<body data-page="records">
<a class="skip-link" href="#main">Skip to content</a>
<div class="glow" aria-hidden="true">
  <span class="glow__blob glow__blob--cyan"><i></i></span>
  <span class="glow__blob glow__blob--azure"><i></i></span>
  <span class="glow__blob glow__blob--violet"><i></i></span>
</div>

<header class="header">
  <div class="wrap header__inner">
    <a class="logo" href="index.html" aria-label="DDR Score Tracker — home">
      <img class="logo__mark" src="assets/img/ddr-arrow.png" alt="" width="770" height="770" />
      <span class="logo__text">
        <span class="logo__word">Score Tracker</span>
        <span class="logo__ver" id="app-version"></span>
      </span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a class="nav__link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Overview
      </a>
      <a class="nav__link" href="records.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
        My Records
      </a>
      <a class="nav__link" href="about.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        About
      </a>
    </nav>

    <div class="header__actions">
      <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle light theme">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-toggle__knob"></span>
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero hero--stack">
    <div class="wrap">
      <h1 class="hero__title" style="font-size:clamp(26px,3.2vw,40px)">My Records</h1>
      <p class="hero__sub">
        Every chart cleared with a Perfect Full Combo or higher.
      </p>
    </div>
  </section>

  <div class="toolbar">
    <div class="filter-sheet__head">
      <p class="eyebrow">Filter &amp; sort</p>
      <button class="icon-btn" type="button" id="filter-close" aria-label="Close filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="wrap toolbar__inner">
      <!-- Mobile: one row only, so the sticky bar stays shallow. The full set
           lives in the overlay behind "Filter". -->
      <label class="search search--compact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q-compact" placeholder="Search" aria-label="Search song or artist" />
      </label>
      <button class="filter-btn" type="button" id="filter-open" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
        Filter<span class="filter-btn__count" id="filter-count" hidden></span>
      </button>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search song or artist" aria-label="Search song or artist" />
      </label>

      <span class="select select--wide">
        <select id="difficulty" aria-label="Filter by difficulty">
          <option value="">All difficulties</option>
          <option value="ESP">Expert</option>
          <option value="CSP">Challenge</option>
        </select>
      </span>

      <span class="select">
        <select id="level" aria-label="Filter by level"><option value="">All levels</option></select>
      </span>

      <span class="select">
        <select id="sort" aria-label="Sort records">
          <option value="alpha">Sort · A–Z</option>
          <option value="alpha-desc">Sort · Z–A</option>
          <option value="score-desc">Sort · Highest score</option>
          <option value="score-asc">Sort · Lowest score</option>
          <option value="level-desc">Sort · Highest level</option>
          <option value="level-asc">Sort · Lowest level</option>
          <option value="difficulty">Sort · Difficulty</option>
          <option value="origin">Sort · Origin (oldest first)</option>
        </select>
      </span>

      <span class="select">
        <select id="origin" aria-label="Filter by origin mix"><option value="">All origins</option></select>
      </span>

      <button class="filter-sheet__done" type="button" id="filter-done">Show results</button>
    </div>
  </div>

  <section class="records">
    <div class="wrap">
      <div class="record-grid" id="grid"></div>
      <p class="empty" id="empty" hidden>No records match those filters</p>
    </div>
  </section>

</main>


<!-- ===================== DETAIL DRAWER ===================== -->
<div class="drawer-scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <button class="icon-btn drawer__close" type="button" id="drawer-close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
  </button>
  <div id="drawer-body"></div>
</aside>

<div id="yt-host"></div>
<div class="player" role="region" aria-label="Background music">
  <button class="player__btn player__btn--play" type="button" aria-label="Play music">
    <svg class="player__icon--play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="player__icon--pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="player__eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="player__meta">
    <div class="player__label">Now playing</div>
    <div class="mixpick" id="mixpick" data-open="false">
      <button class="mixpick__btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose background mix">
        <span class="mixpick__value">—</span>
        <svg class="mixpick__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <ul class="mixpick__menu" role="listbox" aria-label="Background mix" hidden></ul>
    </div>
  </div>
  <!-- Volume sits beside the mix picker: the bottom-right corner is the credit.
       On desktop the slider is inline; on mobile it hides in a popover behind
       the speaker button. -->
  <div class="player__vol" data-open="false">
    <button class="player__btn player__vol-toggle" type="button"
            aria-label="Volume" aria-expanded="false">
      <svg class="player__icon--sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <svg class="player__icon--muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>
    <div class="player__vol-pop">
      <button class="player__btn player__btn--mute" type="button" aria-label="Mute">
      <svg class="player__icon--sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <svg class="player__icon--muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
      </button>
      <input class="player__volume" type="range" min="0" max="100" value="35" aria-label="Volume" />
    </div>
  </div>

  <p class="player__credit">
    <span>Created by</span>
    <a href="https://adryanputra.com" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
      Adryan Putra</a>
  </p>
</div>

<script src="data/records.js?v=20260818230226"></script>
<script src="assets/js/app.js?v=20260818230226"></script>
<script src="assets/js/drawer.js?v=20260818230226"></script>
<script src="assets/js/records.js?v=20260818230226"></script>
</body>
</html>
